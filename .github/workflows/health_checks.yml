name: health_checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Self-hosted Mac Mini. This workflow also runs on pull_request, and
# self-hosted runners on a public repo are unsafe for fork PRs (arbitrary
# code execution) — so every job here only runs for push-to-main or a PR
# authored by the repo owner. Everyone else's PRs simply skip these jobs.
jobs:
  install:
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login == 'johnpc'
    runs-on: [self-hosted, mac-mini]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup_node
      - uses: ./.github/actions/install_with_cache
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login == 'johnpc'
    runs-on: [self-hosted, mac-mini]
    needs:
      - install
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup_node
      - uses: ./.github/actions/build_with_cache
  test_with_coverage:
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login == 'johnpc'
    needs:
      - install
    runs-on: [self-hosted, mac-mini]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup_node
      - uses: ./.github/actions/restore_install_cache
      - run: echo "{}" > amplify_outputs.json
      - run: npm run build
        env:
          ADMIN_API_KEY: ADMIN_API_KEY
  lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login == 'johnpc'
    runs-on: [self-hosted, mac-mini]
    needs:
      - install
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup_node
      - uses: ./.github/actions/restore_install_cache
      - run: npm run lint
